name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
        type: choice
        options:
          # ── 4.0.x release candidate (JDK 21) ────────────
          - 4.0.0-rc1
          # ── 3.4.x (JDK 21) ──────────────────────────────
          - 3.4.2.6
          - 3.4.2.4
          - 3.4.2.3
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
          - 3.4.1.0
          - 3.4.0.0
          # ── 3.3.x (JDK 21) ──────────────────────────────
          - 3.3.2.1
          - 3.3.2.0
          - 3.3.1.3
          # ── 3.2.x (JDK 17) ──────────────────────────────
          - 3.2.0.4
          - 3.2.0.3
          - 3.2.0.2
          - 3.2.0.1
          - 3.2.0.0
          # ── 3.1.x (JDK 17) ──────────────────────────────
          - 3.1.0.3
          - 3.1.0.2
          - 3.1.0.1
          - 3.1.0
          # ── 3.0.x (JDK 11) ──────────────────────────────
          - 3.0.0.2
          -
